name: Bug Report
description: Report a bug affecting PrintBit behavior
title: "[BUG]"
labels: ['bug']

body:
- type: dropdown
  id: area
  attributes:
    label: Affected Area
    options:
      - Backend (API / Server)
      - Frontend (UI / Browser)
      - Printing Pipeline
      - Database
      - Hardware Integration
    validations:
      required: true

- type: dropdown
  id: printer_issue
  attributes:
    label: Printer Issue Type
    options:
      - Not applicable
      - No paper
      - Paper jam
      - No ink
      - Printer offline
      - Print stuck in queue
      - Scan failure
      - Unknown
    validations:
      required: true

- type: textarea
  id: description
  attributes:
    label: Description
    placeholder: Describe the issue clearly
    validations:
      required: true

- type: textarea
  id: steps
  attributes:
    label: Steps to Reproduce
    placeholder: |
      1. Go to...
      2. Upload file...
      3. Click print...
    validations:
      required: true

- type: textarea
  id: expected
  attributes:
    label: Expected Behavior
    validations:
      required: true

- type: textarea
  id: actual
  attributes:
    label: Actual Behavior
    validations:
      required: true

- type: textarea
  id: logs
  attributes:
    label: Logs / Errors
    description: Paste relevant logs or errors

- type: dropdown
  id: environment
  attributes:
    label: Environment
    options:
      - Local development
      - Production (kiosk)
    validations:
      required: true

- type: textarea
  id: hardware
  attributes:
    label: Hardware Context
    description: Printer model, connection type, scanner usage, etc.

- type: textarea
  id: additional
  attributes:
    label: Additional Context

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Verify student ID · PrintBit</title>
    <link rel="stylesheet" href="/portal/styles.css" />
    <script defer src="/portal/app.js"></script>
  </head>
  <body>
    <main class="portal-shell">
      <section class="portal-card" aria-labelledby="portalTitle">
        <div class="brand" aria-label="PrintBit">
          <span class="brand__mark" aria-hidden="true">P</span>
          <span>PrintBit</span>
        </div>

        <p class="eyebrow">KIOSK ACCESS</p>
        <h1 id="portalTitle">Verify your student ID</h1>
        <p class="intro">
          Enter your seven-digit school ID to unlock the nearby PrintBit kiosk.
        </p>

        <form id="studentIdForm" novalidate>
          <label for="studentId">Student ID</label>
          <input
            id="studentId"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{3}-[0-9]{4}"
            maxlength="8"
            placeholder="123-4567"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-describedby="studentIdHelp studentIdError"
          />
          <p class="field-help" id="studentIdHelp">Format: 123-4567</p>
          <p
            class="field-error"
            id="studentIdError"
            role="alert"
            aria-live="assertive"
            hidden
          ></p>
          <button id="verifyStudentId" type="submit">Unlock kiosk</button>
        </form>

        <p class="portal-status" id="portalStatus" role="status" aria-live="polite"></p>
        <p class="privacy-note">
          Your ID is used only for this verification and is not saved on this phone.
        </p>
      </section>
    </main>
  </body>
</html>
